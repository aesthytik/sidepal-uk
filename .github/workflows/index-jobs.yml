name: Index jobs

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Minutes to spend looking for new job boards
        default: "40"

permissions:
  contents: read

concurrency:
  group: index-jobs

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the job index
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >
          npx ts-node-script --transpile-only
          --compiler-options '{"module":"commonjs","moduleResolution":"node","esModuleInterop":true}'
          scripts/index-jobs.ts ${{ github.event.inputs.budget_minutes || 40 }}
