name: Index jobs

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Minutes to spend looking for new job boards
        default: "40"

permissions:
  contents: write

concurrency:
  group: index-jobs

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the job index
        run: >
          npx ts-node-script --transpile-only
          --compiler-options '{"module":"commonjs","moduleResolution":"node","esModuleInterop":true}'
          scripts/index-jobs.ts ${{ github.event.inputs.budget_minutes || 40 }}
      - name: Commit changes
        run: |
          git config user.name "horus-bot"
          git config user.email "horus-bot@users.noreply.github.com"
          git add public/data/jobs.json public/data/enrichment-cache.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update job index"
            git pull --rebase origin main
            git push origin main
          fi
